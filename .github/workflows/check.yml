name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npx skills finds every skill
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          npx -y skills add . --list | tee list.txt
          for name in $(jq -r '.groupings[].skills[]' skills.sh.json); do
            grep -qw -- "$name" list.txt || { echo "npx skills does not list $name"; exit 1; }
          done
      - name: Claude Code accepts the marketplace
        run: npx -y @anthropic-ai/claude-code plugin validate .
